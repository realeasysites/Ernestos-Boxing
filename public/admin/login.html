<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in · Ernesto's Dashboard</title>
  <link rel="icon" href="/img/logo.jpg">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="login-body">
  <form class="login-card" id="loginForm">
    <img src="/img/logo.jpg" alt="Ernesto's Boxing Gym" width="84" height="84">
    <h1>Gym Dashboard</h1>
    <p>Enter the dashboard password.</p>
    <input type="password" name="password" id="pw" placeholder="Password" autocomplete="current-password" required autofocus>
    <button type="submit">Sign in</button>
    <p class="err" id="err" role="alert"></p>
  </form>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var err = document.getElementById('err');
      err.textContent = '';
      var r = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
      if (r.ok) { location.reload(); return; }
      var j = await r.json().catch(function () { return {}; });
      err.textContent = j.error || 'Sign-in failed.';
    });
  </script>
</body>
</html>
